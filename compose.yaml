services:
  transmission-web:
    build: .
    image: transmission-cove:local
    ports:
      - "8080:8080"
    environment:
      TRANSMISSION_RPC_URL: ${TRANSMISSION_RPC_URL:-http://host.docker.internal:9091/transmission/rpc}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
